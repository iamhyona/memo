<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daily Archive</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Archive">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1;
  --acc:#3182f6; --red:#ef4444; --chip:#f2f4f6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; font-size:15px; letter-spacing:-0.01em; }
button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; }
.mute { color:var(--mute); }
.hide { display:none !important; }

/* 상단 */
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:560px; margin:0 auto; }
.brand { border:0; background:none; padding:0; font-size:22px; font-weight:800; }
.hr { display:flex; align-items:center; gap:8px; }
.hdt { font-size:13px; font-weight:600; color:var(--mute); }
.ib { width:38px; height:38px; border:0; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--sub); padding:0; flex:none; }
.ib svg { width:19px; height:19px; }
nav { display:flex; justify-content:flex-start; gap:20px; max-width:560px; margin:6px auto 0; border-bottom:1px solid var(--line); }
nav button { flex:none; border:0; background:none; padding:12px 0 10px; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button.on { color:var(--txt); border-bottom-color:var(--txt); }

main { max-width:560px; margin:0 auto; padding:14px 16px calc(110px + env(safe-area-inset-bottom)); }
.card { background:var(--card); border-radius:20px; padding:22px 20px; margin-bottom:12px; }
.ct { font-size:17px; font-weight:700; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ct small { font-size:13px; font-weight:500; color:var(--mute); }
.ct a { color:var(--acc); font-size:13px; font-weight:600; text-decoration:none; }
.nav2 { display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.nav2 .lbl { border:0; background:none; font-size:20px; font-weight:800; padding:4px; }
.arw { display:flex; gap:6px; }
.arw button { width:36px; height:36px; border-radius:50%; border:0; background:#fff; font-size:18px; color:var(--sub); }
.arw button:disabled { opacity:.35; }
.empty { text-align:center; color:var(--mute); padding:28px 0; font-size:14px; line-height:1.6; }
.ld { text-align:center; color:var(--mute); padding:60px 0; }
.big1 small { display:block; color:var(--mute); font-size:13px; margin-bottom:6px; }
.big1 b { font-size:30px; font-weight:800; letter-spacing:-0.02em; }
.big1 .pct { font-size:.6em; margin-left:1px; }
.big1 .sub { margin-top:8px; font-size:13px; color:var(--sub); }
.up { color:var(--acc); } .dn { color:var(--red); }
.mini { display:grid; grid-template-columns:1fr 1fr 1fr; background:#fff; border-radius:20px; padding:16px 8px; margin-bottom:12px; text-align:center; }
.mini small { display:block; color:var(--mute); font-size:12px; margin-bottom:4px; } .mini b { font-size:16px; }

/* 주간 습관 */
.wk { padding:20px 14px 10px; }
.wh { display:flex; align-items:center; justify-content:space-between; margin:0 4px 14px; gap:6px; }
.wh .t { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:800; white-space:nowrap; }
.cnt { background:var(--chip); color:var(--sub); font-size:13px; font-weight:700; border-radius:8px; padding:3px 8px; }
.wnav { display:flex; align-items:center; gap:2px; }
.wnav button { border:0; background:none; width:28px; height:30px; padding:0; color:var(--sub); font-size:18px; }
.wnav span { font-size:13px; font-weight:700; white-space:nowrap; }
.hg { display:grid; grid-template-columns:minmax(0,1fr) repeat(7, 30px); column-gap:4px; align-items:center; }
@media (min-width:420px) { .hg { grid-template-columns:minmax(0,1fr) repeat(7, 34px); column-gap:6px; } }
.hg .hh { text-align:center; font-size:11px; font-weight:600; color:var(--mute); padding-bottom:8px; line-height:1.2; }
.hg .hh b { display:block; margin:4px auto 0; font-size:13px; color:var(--txt); width:26px; height:24px; line-height:24px; border-radius:8px; }
.hg .hh.td { color:var(--txt); }
.hg .hh.td b { background:var(--txt); color:#fff; }
.hg .hs { font-size:11px; color:var(--mute); padding:0 4px 8px; line-height:1.35; align-self:end; }
.hg .hs button { border:0; background:var(--chip); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--sub); }
.hg .ln { grid-column:1 / -1; border-top:1px solid var(--line); margin:0 -14px 2px; }
.hn { border:0; background:none; text-align:left; padding:8px 2px; min-width:0; display:flex; flex-direction:column; gap:2px; }
.hn .n { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; min-width:0; }
.hn .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:7px; height:7px; border-radius:50%; flex:none; }
.hn small { font-size:11px; color:var(--mute); padding-left:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hn small b { color:var(--sub); font-weight:700; }
.hn small b.ok { color:var(--acc); }
.ck { border:0; width:100%; aspect-ratio:1; max-width:34px; justify-self:center; border-radius:9px; background:var(--chip); padding:0; display:flex; align-items:center; justify-content:center; transition:transform .08s; }
.ck:active { transform:scale(.9); }
.ck svg { width:15px; height:15px; opacity:0; }
.ck.on svg { opacity:.75; }
.ck.fu { opacity:.4; }
.hadd { grid-column:1 / -1; border:0; background:none; text-align:left; padding:12px 4px 8px; font-size:14px; font-weight:600; color:var(--mute); }
.hadd::before { content:'+'; font-size:17px; margin-right:6px; }

/* 막대·목록 */
.leg { list-style:none; margin:0; padding:0; }
.bars li { padding:9px 0; }
.bars .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; gap:8px; }
.bars .row1 .n { display:flex; align-items:center; gap:8px; font-weight:600; min-width:0; }
.bars .row1 .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bars .row1 .v { font-size:13px; color:var(--sub); white-space:nowrap; } .bars .row1 .v b { color:var(--txt); }
.bars .trk { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; }
.bars .fil { height:100%; border-radius:4px; }
.bars .sm { font-size:11px; color:var(--mute); margin-top:5px; }
.mbar { display:flex; align-items:flex-end; gap:6px; height:130px; margin-top:6px; }
.mbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.mbar em { font-style:normal; font-size:10px; color:var(--mute); margin-bottom:3px; font-weight:600; }
.mbar i { display:block; width:100%; max-width:18px; background:#c9dcfb; border-radius:4px 4px 0 0; min-height:2px; }
.mbar div.cur i { background:var(--acc); } .mbar div.cur em { color:var(--acc); }
.mbar span { font-size:11px; color:var(--mute); margin-top:6px; }

/* 월 달력 */
.cal .wd, .cal .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal .wd div { text-align:center; font-size:12px; color:var(--mute); padding-bottom:6px; }
.cal .grid button { border:0; min-height:54px; border-radius:10px; background:none; font-size:13px; font-weight:600; padding:4px 1px 6px; color:var(--sub); position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
.cal .grid .dnum { width:24px; height:24px; line-height:24px; border-radius:50%; text-align:center; }
.cal .grid .dts { display:flex; flex-wrap:wrap; justify-content:center; gap:2px; max-width:100%; padding:0 2px; }
.cal .grid .dts i { width:6px; height:6px; border-radius:50%; display:block; }
.cal .grid button.out { visibility:hidden; }
.cal .grid button.fu { opacity:.45; }
.cal .grid button.td .dnum { background:var(--txt); color:#fff; }
.cal .grid button.sel { background:var(--chip); }
.cal .grid button.dy .dnum { box-shadow:inset 0 -2px 0 var(--faint); border-radius:6px; }
.cal .grid button.td.dy .dnum { border-radius:50%; box-shadow:none; }
.dyk { display:inline-block; width:12px; height:2px; background:var(--faint); vertical-align:middle; margin-right:2px; }
.selh { display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px; } .selh b { font-size:15px; } .selh small { color:var(--mute); font-size:12px; }
.sec { font-size:20px; font-weight:800; margin:26px 4px 12px; display:flex; align-items:baseline; gap:8px; }
.sec small { font-size:12px; color:var(--mute); font-weight:500; }
/* 픽토그램 */
.hico { width:22px; height:22px; flex:none; display:block; }
.hico.sm { width:16px; height:16px; }
/* 오늘 카드 */
.tdh { display:flex; align-items:center; justify-content:space-between; margin:4px 4px 12px; }
.tdh b { font-size:20px; font-weight:800; }
.dstrip { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px; }
.dstrip button { border:0; background:#fff; border-radius:12px; padding:7px 0 11px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--mute); font-weight:600; position:relative; }
.dstrip button b { font-size:16px; color:var(--sub); }
.dstrip button.on { box-shadow:inset 0 0 0 2px var(--txt); } .dstrip button.on b { color:var(--txt); }
.dstrip button.td { color:var(--txt); }
.dstrip button.fu { opacity:.4; }
.dstrip i { position:absolute; bottom:5px; left:28%; right:28%; height:3px; border-radius:2px; background:var(--chip); overflow:hidden; }
.dstrip i em { display:block; height:100%; background:var(--txt); }
.hc { display:flex; align-items:center; gap:12px; width:100%; border:0; border-radius:18px; padding:14px 16px; margin-bottom:8px; text-align:left; color:var(--txt); transition:transform .08s; }
.hc:active { transform:scale(.98); }
.hc .cc { width:28px; height:28px; border-radius:50%; border:2.5px solid rgba(25,31,40,.22); flex:none; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.35); }
.hc .cc svg { width:15px; height:15px; }
.hc .hi { width:36px; height:36px; border-radius:11px; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; flex:none; }
.hc .m { flex:1; min-width:0; } .hc .m div { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hc .m small { font-size:12px; color:rgba(25,31,40,.55); font-weight:500; }
.hc.done { background:#e9ecef !important; color:var(--mute); }
.hc.done .cc { background:#fff; border-color:#fff; }
.hc.done .hi { opacity:.55; } .hc.done .m small { color:var(--faint); }
.hsub { font-size:13px; color:var(--mute); font-weight:700; margin:16px 4px 8px; }
/* 월간 리뷰 */
.dwrap { display:flex; justify-content:center; margin:0 0 14px; }
.dnt { width:200px; height:200px; }
.dnt text { font-size:12px; font-weight:700; fill:#fff; }
.dleg li { display:flex; align-items:center; gap:10px; padding:8px 0; }
.dleg .hi2 { width:28px; height:28px; border-radius:9px; background:var(--chip); display:flex; align-items:center; justify-content:center; flex:none; }
.dleg .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.dleg .v { font-weight:700; }
.note { margin:0; font-size:15px; line-height:1.6; color:var(--sub); white-space:pre-wrap; word-break:break-all; }
.ntb { width:100%; border:1.5px dashed var(--line); background:none; border-radius:14px; padding:22px 12px; color:var(--mute); font-size:14px; }
/* 연간 칸 */
.yh { display:flex; justify-content:space-between; align-items:center; margin:18px 4px 8px; }
.yh .n { display:flex; align-items:center; gap:7px; font-weight:700; font-size:14px; }
.yh small { color:var(--mute); font-size:12px; }
.yg { background:#fff; border-radius:12px; padding:9px; display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:1.5px; }
.yg i { display:block; aspect-ratio:1; border-radius:1.5px; background:#e9ecef; }
.yg i.o { background:none; } .yg i.f { background:#f4f5f7; }
.lv1 { background:#dbe8fd !important; } .lv2 { background:#a9c8fa !important; } .lv3 { background:#6aa2f8 !important; color:#fff !important; } .lv4 { background:var(--acc) !important; color:#fff !important; }
.legend { display:flex; justify-content:flex-end; align-items:center; gap:4px; font-size:11px; color:var(--mute); margin-top:10px; }
.legend i { width:12px; height:12px; border-radius:3px; background:var(--chip); display:inline-block; }
.dchk { display:flex; flex-wrap:wrap; gap:6px; }
.dchk button { border:0; border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600; background:var(--chip); color:var(--mute); display:flex; align-items:center; gap:6px; }
.dchk button.on { color:var(--txt); }
.dchk button .hico { opacity:.35; } .dchk button.on .hico { opacity:1; }

/* 사진 */
.pst { display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; background:#fff; border-radius:20px; padding:16px 8px; margin-bottom:12px; }
.pst b { display:block; font-size:18px; } .pst small { color:var(--mute); font-size:12px; }
.tabs2 { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 12px; padding:0 16px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tabs2::-webkit-scrollbar { display:none; }
.tabs2 button { flex:none; border:0; background:#fff; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; color:var(--sub); }
.tabs2 button small { color:var(--faint); font-weight:600; margin-left:3px; }
.tabs2 button.on { background:var(--txt); color:#fff; } .tabs2 button.on small { color:#8b95a1; }
.pg { display:grid; grid-template-columns:repeat(3,1fr); gap:3px; border-radius:16px; overflow:hidden; }
.pg button { border:0; padding:0; aspect-ratio:1; background:#e5e8eb; position:relative; overflow:hidden; display:block; width:100%; }
.pg img { width:100%; height:100%; object-fit:cover; display:block; }
.pg button.up::after { content:'올리는 중'; position:absolute; inset:0; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--sub); }
.pcat { font-size:15px; font-weight:800; margin:20px 4px 10px; display:flex; justify-content:space-between; align-items:baseline; }
.pcat:first-child { margin-top:4px; }
.pcat button { border:0; background:none; font-size:13px; color:var(--mute); font-weight:600; padding:0; }

/* 일기 */
.dc { background:#fff; border-radius:20px; padding:18px 20px; margin-bottom:10px; width:100%; border:0; text-align:left; display:block; }
.dc .dh { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.dc .dh b { font-size:15px; }
.dc .dh small { color:var(--mute); font-weight:500; margin-left:4px; }
.dc p { margin:0; font-size:15px; line-height:1.6; color:var(--sub); white-space:pre-wrap; word-break:break-all; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.dc .ph { display:flex; gap:4px; margin-top:12px; }
.dc .ph img { width:56px; height:56px; object-fit:cover; border-radius:10px; background:var(--chip); }
.mood { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; border-radius:999px; padding:4px 9px 4px 7px; background:var(--chip); color:var(--sub); }
.td1 { display:flex; align-items:center; gap:12px; border:0; background:none; width:100%; padding:0; text-align:left; }
.td1 .m { flex:1; min-width:0; }
.td1 .m div { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.td1 .m small { color:var(--mute); font-size:13px; }
.pen { width:40px; height:40px; border-radius:12px; background:var(--chip); display:flex; align-items:center; justify-content:center; flex:none; color:var(--sub); }
.pen svg { width:20px; height:20px; }

/* 플로팅 버튼 */
.fab { position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom)); width:60px; height:60px; border-radius:50%;
  border:0; background:var(--txt); color:#fff; box-shadow:0 8px 20px rgba(25,31,40,.25); z-index:15; display:flex; align-items:center; justify-content:center; }
.fab::before, .fab::after { content:''; position:absolute; width:22px; height:2.5px; background:#fff; border-radius:2px; }
.fab::after { transform:rotate(90deg); }

/* 바텀시트 */
.dimbg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s; }
.bs { position:fixed; left:0; right:0; bottom:0; z-index:31; background:#fff; border-radius:24px 24px 0 0; max-height:92vh; overflow:auto;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .22s ease, visibility .22s; max-width:560px; margin:0 auto; visibility:hidden; }
.bs { overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y; }
html { overflow-x:hidden; } body { overflow-x:clip; max-width:100%; }
html.lock { overflow:hidden; }
.bs.open { transform:none; visibility:visible; } .dimbg.open { opacity:1; pointer-events:auto; }
.bs h3 { margin:0 0 16px; font-size:20px; }
.bsh { position:sticky; top:-22px; z-index:2; height:46px; margin:-22px -20px 4px; background:#fff; display:flex; justify-content:flex-end; align-items:center; padding:0 14px; touch-action:none; }
.bsh i { position:absolute; left:50%; top:9px; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:#d1d6db; }
.bsx { width:32px; height:32px; border:0; border-radius:50%; background:var(--chip); color:var(--sub); display:flex; align-items:center; justify-content:center; padding:0; margin-top:6px; }
.bsx svg { width:16px; height:16px; }
.fl { font-size:13px; color:var(--mute); margin:16px 2px 8px; font-weight:600; }
.frow { display:flex; gap:8px; margin-bottom:10px; }
.f { flex:1; min-width:0; } .f label { display:block; font-size:12px; color:var(--mute); margin:0 0 5px 2px; font-weight:600; }
.f input { width:100%; border:0; background:var(--chip); border-radius:12px; padding:12px; outline:0; font-size:16px; height:46px; min-width:0; max-width:100%; display:block; -webkit-appearance:none; appearance:none; }
.f input[type=date] { color:var(--txt); text-align:left; line-height:22px; }
.f input::-webkit-date-and-time-value { text-align:left; margin:0; min-height:22px; }
.f input::-webkit-datetime-edit { padding:0; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; color:var(--sub); font-weight:500; }
.chips button.on { background:var(--txt); color:#fff; }
.chips input { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:16px; width:130px; outline:0; }
.pal { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.pal button { border:0; aspect-ratio:1; border-radius:12px; padding:0; display:flex; align-items:center; justify-content:center; }
.pal button svg { width:18px; height:18px; opacity:0; } .pal button.on svg { opacity:1; }
.acts { display:flex; gap:8px; margin-top:22px; }
.acts button { flex:1; border:0; border-radius:14px; padding:16px; font-weight:700; font-size:16px; }
.save { background:var(--txt); color:#fff; } .del { background:#fef2f2; color:var(--red); flex:0 0 96px !important; }
.del.sure { flex:0 0 170px !important; background:var(--red); color:#fff; }
.save:disabled { opacity:.4; }
textarea.dx { width:100%; border:0; background:var(--chip); border-radius:14px; padding:14px; font-size:16px; line-height:1.6; min-height:220px; outline:0; resize:none; display:block; }
.moods { display:flex; gap:6px; }
.moods button { flex:1; border:0; background:var(--chip); border-radius:12px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--mute); }

.mrow .hb { flex:1; min-width:0; border:0; background:none; text-align:left; padding:10px 4px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }

  });
})();
$('#pvE').onclick = function () { var id = PV.id; closeBs(); setTimeout(function () { openUpload(id); }, 230); };
sure($('#pvX'), function () { delPhoto(PV.id); });

/* 일기 */
var DY = null;
function openDiary(d) {
  var x = diaryOf(d);
  DY = { old: x ? d : '', mood: x ? x.mood : '' };
  $('#dyT').textContent = mdw(d);
  $('#dyD').value = d; $('#dyX').value = x ? x.text : '';
  $('#dyDel').classList.toggle('hide', !x); unsure($('#dyDel'));
  drawDiary(); openBs('#dy');
}
function drawDiary() {
  $('#dyM').innerHTML = MOODS.map(function (m) { return '<button data-k="' + m.k + '" class="' + (DY.mood === m.k ? 'on' : '') + '"><i style="background:' + m.c + '"></i>' + m.k + '</button>'; }).join('');
  $$('#dyM button').forEach(function (b) { b.onclick = function () { DY.mood = DY.mood === b.dataset.k ? '' : b.dataset.k; drawDiary(); }; });
  var d = $('#dyD').value;
  $('#dyP').innerHTML = d ? photosOf(d).map(function (p) { return '<img src="' + esc(purl(p)) + '" alt="">'; }).join('') : '';
}
$('#dyD').onchange = function () { if (this.value) $('#dyT').textContent = mdw(this.value); drawDiary(); };
$('#dyS').onclick = function () {
  var d = $('#dyD').value, text = $('#dyX').value.replace(/\s+$/, '');
  if (!d) return toast('날짜를 선택해 주세요');
  if (!text.trim() && !DY.mood) return toast('기분이나 내용을 적어 주세요');
  if (d !== DY.old && diaryOf(d)) return toast(md(d) + '에는 이미 일기가 있어요');
  var o = { d: d, mood: DY.mood, text: text, old: DY.old };
  S.D.diary = S.D.diary.filter(function (x) { return x.d !== d && x.d !== DY.old; });
  S.D.diary.push({ d: d, mood: DY.mood, text: text, ts: '' });
  closeBs(); render(); saveCache(); toast('저장했어요');
  call('appDiary', S.pin, o).catch(function (e) { toast(errMsg(e)); load(); });
};
sure($('#dyDel'), function () {
  var d = DY.old;
  S.D.diary = S.D.diary.filter(function (x) { return x.d !== d; });
  closeBs(); render(); saveCache(); toast('삭제했어요');
  call('appDiary', S.pin, { d: d, mood: '', text: '', old: d }).catch(function (e) { toast(errMsg(e)); load(); });
});

/* 월간 메모 */
var NT = null;
function openNote(ym) {
  NT = ym;
  $('#ntT').textContent = +ym.slice(0, 4) + '년 ' + +ym.slice(5, 7) + '월 메모';
  $('#ntX').value = S.D.notes[ym] || '';
  $('#ntDel').classList.toggle('hide', !S.D.notes[ym]); unsure($('#ntDel'));
  openBs('#nt');
  setTimeout(function () { $('#ntX').focus(); }, 250);
}
function saveNote(text) {
  if (text) S.D.notes[NT] = text; else delete S.D.notes[NT];
  closeBs(); render(); saveCache(); toast(text ? '저장했어요' : '지웠어요');
  call('appNote', S.pin, NT, text).catch(function (e) { toast(errMsg(e)); load(); });
}
$('#ntS').onclick = function () { saveNote($('#ntX').value.replace(/\s+$/, '')); };
sure($('#ntDel'), function () { saveNote(''); });

/* 설정 */
function renderSettings() {
  if (!S.D) return;
  var hs = S.D.habits;
  $('#stH').innerHTML = hs.length ? hs.map(function (x, i) {
    return '<div class="mrow"><button class="hb" data-h="' + x.id + '">' + hIco(x, 'hico sm') + '<span>' + esc(x.name) + '</span><small>' + (x.target === 7 ? '매일' : '주 ' + x.target + '회') + '</small></button>' +
      '<button data-u="' + i + '"' + (i ? '' : ' disabled') + ' aria-label="위로">▲</button><button data-w="' + i + '"' + (i < hs.length - 1 ? '' : ' disabled') + ' aria-label="아래로">▼</button></div>';
  }).join('') : '<p class="mnote">아직 습관이 없어요</p>';
  $$('#stH .hb').forEach(function (b) { b.onclick = function () { var id = b.dataset.h; closeBs(); setTimeout(function () { openHabit(id); }, 230); }; });
  $$('#stH [data-u],#stH [data-w]').forEach(function (b) {
    b.onclick = function () {
      var i = +(b.dataset.u || b.dataset.w), j = b.dataset.u != null ? i - 1 : i + 1, t = hs[i];
      hs[i] = hs[j]; hs[j] = t; renderSettings(); render(); saveHabits();
    };
  });
  $('#stC').innerHTML = S.D.cats.map(function (c, i) {
    return '<div class="mrow"><input data-i="' + i + '" value="' + esc(c) + '" maxlength="12"><button class="x" data-x="' + i + '" aria-label="삭제">×</button></div>';
  }).join('');
  $$('#stC input').forEach(function (inp) {
    inp.onchange = function () {
      var i = +inp.dataset.i, old = S.D.cats[i], v = inp.value.trim();
      if (!v || v === old) { inp.value = old; return; }
      if (S.D.cats.indexOf(v) >= 0) { inp.value = old; return toast('이미 있는 카테고리예요'); }
      S.D.cats[i] = v;
      S.D.photos.forEach(function (p) { if (p.cat === old) p.cat = v; });
      if (S.pcat === old) S.pcat = v;
      var ren = {}; ren[old] = v; saveCats(ren); render(); toast('이름을 바꿨어요');
    };
  });
  $$('#stC .x').forEach(function (b) {
    b.onclick = function () {
      var c = S.D.cats[+b.dataset.x], n = S.D.photos.filter(function (p) { return p.cat === c; }).length;
      if (n) return toast('사진 ' + n + '장이 있어요 · 먼저 다른 카테고리로 옮겨 주세요');
      S.D.cats.splice(+b.dataset.x, 1); saveCats({}); renderSettings(); render();
    };
  });
  $('#stU').innerHTML = S.D.url ? '모든 기록은 구글 시트에 저장돼요 · <a href="' + esc(S.D.url) + '" target="_blank" rel="noopener">구글 시트 열기</a>' : '';
}
function saveCats(ren) { saveCache(); call('appCats', S.pin, S.D.cats, ren).catch(function (e) { toast(errMsg(e)); load(); }); }
$('#stCa').onclick = function () {
  var v = $('#stCn').value.trim(); if (!v) return;
  if (S.D.cats.indexOf(v) >= 0) return toast('이미 있는 카테고리예요');
  S.D.cats.push(v); $('#stCn').value = ''; saveCats({}); renderSettings(); render();
};
$('#stCn').onkeydown = function (e) { if (e.key === 'Enter') $('#stCa').click(); };
$('#setBtn').onclick = function () { if (!S.D) return; renderSettings(); openBs('#st'); };

/* ───── 시작: PIN ───── */
var pinMode = 'enter';
function showPin() {
  $('#pinScr').classList.remove('hide'); $('#pinIn').value = '';
  call('appHasPin').then(function (has) {
    pinMode = has ? 'enter' : 'set';
    $('#pinMsg').textContent = has ? 'PIN 4자리를 입력해 주세요' : '처음이에요. 사용할 PIN 4자리를 정해 주세요';
  }).catch(function () {});
  setTimeout(function () { $('#pinIn').focus(); }, 100);
}
$('#pinBtn').onclick = function () {
  var p = $('#pinIn').value.trim();
  if (!/^\d{4}$/.test(p)) return toast('숫자 4자리로 입력해 주세요');
  var b = $('#pinBtn'); b.classList.add('busy');
  (pinMode === 'set' ? call('appSetPin', p) : call('appCheck', p)).then(function () {
    S.pin = p; ls.set('memo:pin', p); $('#pinScr').classList.add('hide'); load();
  }).catch(function (e) { toast(errMsg(e)); }).then(function () { b.classList.remove('busy'); });
};
$('#pinIn').onkeydown = function (e) { if (e.key === 'Enter') $('#pinBtn').click(); };

hdDate();
if (S.pin) {
  var c0 = cached();
  if (c0) { setData(c0); render(); }
  load();
} else showPin();
</script>
</body>
</html>
