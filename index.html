<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>루틴</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1;
  --acc:#3182f6; --red:#ef4444; --chip:#f2f4f6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; font-size:15px; letter-spacing:-0.01em; }
button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; }
.mute { color:var(--mute); }
.hide { display:none !important; }

/* 상단 */
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:560px; margin:0 auto; }
.brand { border:0; background:none; padding:0; font-size:19px; font-weight:800; letter-spacing:.06em; }
.mode { display:flex; max-width:560px; margin:8px auto 0; background:#e5e8eb; border-radius:12px; padding:3px; gap:2px; }
.mode button { flex:1; border:0; background:none; border-radius:10px; padding:8px 0; font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--mute); }
.hd .mode { margin:0; flex:none; border-radius:11px; padding:3px; }
.hd .mode button { flex:none; padding:7px 7px; font-size:11px; letter-spacing:.03em; border-radius:9px; }
.mode button.on { background:#fff; color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.mode.off button.on { background:none; box-shadow:none; color:var(--mute); }
.arw .tod { width:auto; border-radius:999px; padding:0 12px; font-size:13px; font-weight:700; }
.hm { margin:6px 4px 14px; } .hm small { display:none; } .hm b { font-size:22px; font-weight:800; }
.mk { font-size:13px; font-weight:800; letter-spacing:.06em; }
.pbar { height:6px; border-radius:3px; background:var(--chip); overflow:hidden; margin:-4px 0 14px; } .pbar i { display:block; height:100%; background:var(--txt); }
.lnk { border:0; background:var(--txt); color:#fff; border-radius:999px; padding:9px 16px; font-size:14px; font-weight:700; margin-top:12px; }
.fc { background:#fff; border-radius:20px; overflow:hidden; margin-bottom:12px; }
.fc .fi { border:0; padding:0; display:block; width:100%; background:#e5e8eb; }
.fc .fi img { width:100%; display:block; max-height:560px; object-fit:cover; }
.fc .fm { padding:12px 16px 14px; } .fc .fcat { font-size:12px; font-weight:700; color:var(--sub); background:var(--chip); border-radius:999px; padding:3px 9px; }
.fc .fm p { margin:8px 0 0; font-size:15px; line-height:1.5; color:var(--txt); white-space:pre-wrap; }
.pcal .grid button { min-height:0; aspect-ratio:1; padding:0; overflow:hidden; border-radius:8px; justify-content:flex-start; }
.pcal .grid button img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pcal .grid button .dnum { position:relative; width:auto; height:auto; line-height:1; padding:4px 0 0; font-size:12px; border-radius:0; }
.pcal .grid button.has .dnum { color:#fff; text-shadow:0 0 3px rgba(0,0,0,.5); }
.pcal .grid button.td .dnum { background:none; color:var(--acc); } .pcal .grid button.td.has .dnum { color:#fff; }
.pcal .grid button em { position:absolute; right:3px; bottom:3px; font-style:normal; font-size:10px; font-weight:700; color:#fff; background:rgba(0,0,0,.45); border-radius:6px; padding:1px 4px; }
.dcal .grid button { min-height:46px; }
.dcal .grid .dts i { width:8px; height:8px; }
.ym { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.ym button { border:0; padding:0; aspect-ratio:1; border-radius:14px; background:#fff; position:relative; overflow:hidden; text-align:left; }
.ym button img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.ym button .yl { position:absolute; left:10px; bottom:8px; display:flex; flex-direction:column; }
.ym button img + .yl { color:#fff; text-shadow:0 0 4px rgba(0,0,0,.45); }
.ym button .yl b { font-size:15px; } .ym button .yl small { font-size:12px; opacity:.9; }
.ym button.fu { opacity:.4; }
.dyv .dh { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.dyv p { margin:0; font-size:16px; line-height:1.75; white-space:pre-wrap; word-break:break-all; }
.dyv .ph { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:16px; }
.dyv .ph button { border:0; padding:0; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--chip); }
.dyv .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.pg.ig { gap:2px; border-radius:0; margin:0 -16px 12px; }
.pg.ig button { aspect-ratio:3/4; background:#e5e8eb; }
.f1 { margin:0 -16px 18px; background:#fff; }
.f1 .fi { border:0; padding:0; display:block; width:100%; background:#fff; min-height:120px; }
.f1 .fi img { width:100%; height:auto; display:block; }
.f1 .fm { padding:10px 16px 14px; } .f1 .fcat { font-size:12px; font-weight:700; color:var(--sub); background:var(--chip); border-radius:999px; padding:3px 9px; }
.f1 .fm p { margin:8px 0 0; font-size:15px; line-height:1.5; white-space:pre-wrap; }
.pg button .mul { position:absolute; top:7px; right:7px; width:18px; height:18px; filter:drop-shadow(0 0 2px rgba(0,0,0,.4)); }
.car { position:relative; background:#fff; }
.cs { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.cs::-webkit-scrollbar { display:none; }
.cs .fi { flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; }
.car.multi .cs .fi { aspect-ratio:4/5; }
.car.multi .cs .fi img { width:100%; height:100%; object-fit:cover; }
.car .cn { position:absolute; top:12px; right:12px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; font-weight:600; border-radius:999px; padding:4px 9px; }
.f1 .dots { display:flex; justify-content:center; gap:4px; padding:10px 0 0; }
.f1 .dots i { width:6px; height:6px; border-radius:50%; background:#d1d6db; } .f1 .dots i.on { background:var(--acc); }
.fcnt { display:flex; justify-content:space-between; align-items:baseline; margin:2px 2px 10px; font-size:13px; font-weight:600; color:var(--mute); }
.fcnt b { color:var(--txt); font-size:15px; }
.ym { gap:2px !important; margin:0 -16px; }
.ym button { border-radius:0 !important; aspect-ratio:3/4 !important; }
.st3, .st4 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:6px; }
.st4 { grid-template-columns:repeat(4,1fr); margin:0; }
.st3 small, .st4 small { display:block; font-size:12px; color:var(--mute); margin-bottom:3px; }
.st3 b, .st4 b { font-size:18px; font-weight:800; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .st4 b { font-size:16px; }
.st3 em, .st4 em { display:block; font-style:normal; font-size:11px; color:var(--mute); margin-top:3px; white-space:nowrap; }
.mini em { display:block; font-style:normal; font-size:11px; color:var(--mute); }
.mbar.sm { height:96px; margin-top:16px; }
.sub2 { font-size:13px; font-weight:700; color:var(--mute); margin:18px 0 2px; }
.lows li { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); } .lows li:first-child { border-top:0; }
.lows .n { flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lows .v { font-size:13px; color:var(--sub); }
.wmood { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; text-align:center; }
.wmood i { display:block; width:28px; height:28px; border-radius:50%; margin:0 auto 5px; }
.wmood span { font-size:11px; color:var(--mute); } .wmood .td span { color:var(--txt); font-weight:800; }
.dprev { margin:0; font-size:15px; line-height:1.65; color:var(--sub); white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.dprev.sm { margin-top:14px; font-size:14px; -webkit-line-clamp:2; }
.wdh, .act5 { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.wdh span { text-align:center; font-size:11px; color:var(--mute); padding-bottom:5px; }
.act5 i { display:block; aspect-ratio:1; border-radius:6px; background:#eef0f3; }
.act5 i.a1, .legend i.a1 { background:#c7d2fe; } .act5 i.a2, .legend i.a2 { background:#818cf8; } .act5 i.a3, .legend i.a3 { background:#4338ca; }
.act5 i.f { background:#f7f8fa; } .act5 i.td { box-shadow:inset 0 0 0 2px var(--txt); }
.thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin-top:14px; border-radius:10px; overflow:hidden; }
.thumbs img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--chip); }
.fcnt a { font-size:13px; font-weight:600; text-decoration:none; }
.hd .ib { width:34px; height:34px; } .hd .ib svg { width:18px; height:18px; }
.srbar { display:flex; align-items:center; gap:8px; background:var(--chip); border-radius:14px; padding:0 8px 0 14px; margin-bottom:12px; }
.srbar svg { width:18px; height:18px; color:var(--mute); flex:none; }
.srbar input { flex:1; min-width:0; border:0; background:none; outline:0; font-size:16px; padding:13px 0; -webkit-appearance:none; }
.srbar input::-webkit-search-cancel-button { display:none; }
.srbar button { border:0; background:none; color:var(--mute); font-size:14px; padding:8px; }
.srs { margin:0 -22px 4px; padding:0 22px; } .srs button { background:var(--chip); } .srs button.on { background:var(--txt); color:#fff; }
.srh { font-size:13px; font-weight:800; color:var(--sub); margin:18px 2px 8px; display:flex; gap:6px; align-items:baseline; } .srh b { color:var(--acc); } .srh small { color:var(--mute); font-weight:600; }
.srx { display:flex; flex-wrap:wrap; gap:6px; } .srx button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; font-weight:600; color:var(--sub); }
.srn { font-size:13px; color:var(--mute); line-height:1.6; margin:14px 2px 0; } .srn2 { font-size:12px; color:var(--mute); margin:8px 2px 0; }
.sri { display:block; width:100%; text-align:left; border:0; background:var(--chip); border-radius:14px; padding:12px 14px; margin-bottom:6px; }
.sri .srd { font-size:13px; font-weight:800; margin-right:6px; } .sri .mood { padding:2px 7px; font-size:11px; background:#fff; }
.sri p { margin:6px 0 0; font-size:14px; line-height:1.55; color:var(--sub); }
.sri.go { background:var(--txt); } .sri.go .srd, .sri.go p { color:#fff; }
.sri mark, .srn2 mark, .lows mark { background:#fff1a8; color:inherit; border-radius:3px; padding:0 1px; }
.pg.srg { border-radius:12px; } .pg.srg button { aspect-ratio:1; }
.geo { font-size:12px; color:var(--mute); margin:6px 2px 0; min-height:16px; }
.fpl { font-size:12px; color:var(--mute); margin-left:8px; } .fpl::before { content:'📍'; margin-right:2px; }
.pvl { margin:6px 0 0; font-size:13px; color:var(--sub); }
.dc.none { padding:14px 20px; background:rgba(255,255,255,.55); } .dc.none .dh { margin:0; }
.hr { display:flex; align-items:center; gap:5px; }
.hdt { font-size:13px; font-weight:600; color:var(--mute); }
.ib { width:38px; height:38px; border:0; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--sub); padding:0; flex:none; }
.ib svg { width:19px; height:19px; }
nav { display:flex; justify-content:flex-start; gap:20px; max-width:560px; margin:6px auto 0; border-bottom:1px solid var(--line); }
nav button { flex:none; border:0; background:none; padding:12px 0 10px; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button.on { color:var(--txt); border-bottom-color:var(--txt); }

main { max-width:560px; margin:0 auto; padding:14px 16px calc(110px + env(safe-area-inset-bottom)); }
.card { background:var(--card); border-radius:20px; padding:22px 20px; margin-bottom:12px; }
.ct { font-size:17px; font-weight:700; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ct small { font-size:13px; font-weight:500; color:var(--mute); }
.ct a { color:var(--acc); font-size:13px; font-weight:600; text-decoration:none; }
.nav2 { display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.nav2 .lbl { border:0; background:none; font-size:20px; font-weight:800; padding:4px; }
.arw { display:flex; gap:6px; }
.arw button { width:36px; height:36px; border-radius:50%; border:0; background:#fff; font-size:18px; color:var(--sub); }
.arw button:disabled { opacity:.35; }
.empty { text-align:center; color:var(--mute); padding:28px 0; font-size:14px; line-height:1.6; }
.ld { text-align:center; color:var(--mute); padding:60px 0; }
.big1 small { display:block; color:var(--mute); font-size:13px; margin-bottom:6px; }
.big1 b { font-size:30px; font-weight:800; letter-spacing:-0.02em; }
.big1 .pct { font-size:.6em; margin-left:1px; }
.big1 .sub { margin-top:8px; font-size:13px; color:var(--sub); }
.up { color:var(--acc); } .dn { color:var(--red); }
.mini { display:grid; grid-template-columns:1fr 1fr 1fr; background:#fff; border-radius:20px; padding:16px 8px; margin-bottom:12px; text-align:center; }
.mini small { display:block; color:var(--mute); font-size:12px; margin-bottom:4px; } .mini b { font-size:16px; }

/* 주간 습관 */
.wk { padding:20px 14px 10px; }
.wh { display:flex; align-items:center; justify-content:space-between; margin:0 4px 14px; gap:6px; }
.wh .t { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:800; white-space:nowrap; }
.cnt { background:var(--chip); color:var(--sub); font-size:13px; font-weight:700; border-radius:8px; padding:3px 8px; }
.wnav { display:flex; align-items:center; gap:2px; }
.wnav button { border:0; background:none; width:28px; height:30px; padding:0; color:var(--sub); font-size:18px; }
.wnav span { font-size:13px; font-weight:700; white-space:nowrap; }
.hg { display:grid; grid-template-columns:minmax(0,1fr) repeat(7, 30px); column-gap:4px; align-items:center; }
@media (min-width:420px) { .hg { grid-template-columns:minmax(0,1fr) repeat(7, 34px); column-gap:6px; } }
.hg .hh { text-align:center; font-size:11px; font-weight:600; color:var(--mute); padding-bottom:8px; line-height:1.2; }
.hg .hh b { display:block; margin:4px auto 0; font-size:13px; color:var(--txt); width:26px; height:24px; line-height:24px; border-radius:8px; }
.hg .hh.td { color:var(--txt); }
.hg .hh.td b { background:var(--txt); color:#fff; }
.hg .hs { font-size:11px; color:var(--mute); padding:0 4px 8px; line-height:1.35; align-self:end; }
.hg .hs button { border:0; background:var(--chip); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; color:var(--sub); }
.hg .ln { grid-column:1 / -1; border-top:1px solid var(--line); margin:4px -14px 12px; }
.hg { row-gap:4px; } @media (min-width:420px) { .hg { row-gap:6px; } }
.hg .ck { border-radius:4.5px; }
.card.wk { padding:18px 14px 8px; } .hg .hh { padding-bottom:0; } .hg .hn { padding:2px; }
.hn { border:0; background:none; text-align:left; padding:8px 2px; min-width:0; display:flex; flex-direction:column; gap:2px; }
.hn .n { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; min-width:0; }
.hn .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:7px; height:7px; border-radius:50%; flex:none; }
.hn small { font-size:11px; color:var(--mute); padding-left:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hn small b { color:var(--sub); font-weight:700; }
.hn small b.ok { color:var(--acc); }
.ck { border:0; width:100%; aspect-ratio:1; max-width:34px; justify-self:center; border-radius:9px; background:var(--chip); padding:0; display:flex; align-items:center; justify-content:center; transition:transform .08s; }
.ck:active { transform:scale(.9); }
.ck svg { width:15px; height:15px; opacity:0; }
.ck.on svg { opacity:.75; }
.ck.fu { opacity:.4; }
.hadd { grid-column:1 / -1; border:0; background:none; text-align:left; padding:12px 4px 8px; font-size:14px; font-weight:600; color:var(--mute); }
.hadd::before { content:'+'; font-size:17px; margin-right:6px; }

/* 막대·목록 */
.leg { list-style:none; margin:0; padding:0; }
.bars li { padding:9px 0; }
.bars .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; gap:8px; }
.bars .row1 .n { display:flex; align-items:center; gap:8px; font-weight:600; min-width:0; }
.bars .row1 .n span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bars .row1 .v { font-size:13px; color:var(--sub); white-space:nowrap; } .bars .row1 .v b { color:var(--txt); }
.bars .trk { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; }
.bars .fil { height:100%; border-radius:4px; }
.bars .sm { font-size:11px; color:var(--mute); margin-top:5px; }
.mbar { display:flex; align-items:flex-end; gap:6px; height:130px; margin-top:6px; }
.mbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.mbar em { font-style:normal; font-size:10px; color:var(--mute); margin-bottom:3px; font-weight:600; }
.mbar i { display:block; width:100%; max-width:18px; background:#c9dcfb; border-radius:4px 4px 0 0; min-height:2px; }
.mbar div.cur i { background:var(--acc); } .mbar div.cur em { color:var(--acc); }
.mbar span { font-size:11px; color:var(--mute); margin-top:6px; }

/* 월 달력 */
.cal .wd, .cal .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal .wd div { text-align:center; font-size:12px; color:var(--mute); padding-bottom:6px; }
.cal .grid button { border:0; min-height:54px; border-radius:10px; background:none; font-size:13px; font-weight:600; padding:4px 1px 6px; color:var(--sub); position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
.cal .grid .dnum { width:24px; height:24px; line-height:24px; border-radius:50%; text-align:center; }
.cal .grid .dts { display:flex; flex-wrap:wrap; justify-content:center; gap:2px; max-width:100%; padding:0 2px; }
.cal .grid .dts i { width:6px; height:6px; border-radius:50%; display:block; }
.cal .grid button.out { visibility:hidden; }
.cal .grid button.fu { opacity:.45; }
.cal .grid button.td .dnum { background:var(--txt); color:#fff; }
.cal .grid button.sel { background:var(--chip); }
.cal .grid button.dy .dnum { box-shadow:inset 0 -2px 0 var(--faint); border-radius:6px; }
.cal .grid button.td.dy .dnum { border-radius:50%; box-shadow:none; }
.dyk { display:inline-block; width:12px; height:2px; background:var(--faint); vertical-align:middle; margin-right:2px; }
.selh { display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px; } .selh b { font-size:15px; } .selh small { color:var(--mute); font-size:12px; }
.sec { font-size:20px; font-weight:800; margin:26px 4px 12px; display:flex; align-items:baseline; gap:8px; }
.sec small { font-size:12px; color:var(--mute); font-weight:500; }
/* 픽토그램 */
.hico { width:22px; height:22px; flex:none; display:block; }
.hico.sm { width:16px; height:16px; }
/* 오늘 카드 */
.tdh { display:flex; align-items:center; justify-content:space-between; margin:4px 4px 12px; }
.tdh b { font-size:20px; font-weight:800; }
.dstrip { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:14px; }

function exifGps(file) {

// 원본 파일 → base64 (너무 크면 줄인 사진으로)

function shrink(file, max) {

function kok(d, x) { var v = kv(d, x.id); return x.goal ? v >= x.goal : v > 0; }

var kT;
function kset(d, id, n) {
  n = Math.max(0, Math.min(99, n)); kraw(d, id, n);
  S.kq = S.kq.filter(function (o) { return !(o.d === d && o.h === id); }); S.kq.push({ d: d, h: id, n: n });
  clearTimeout(kT); kT = setTimeout(kflush, 700); saveCache();
}
function kflush() {
  clearTimeout(kT);

  S.kfl = S.kq; S.kq = [];
  call('appCounts', S.pin, S.kfl).then(function () { S.kfl = null; if (S.kq.length) kflush(); })
    .catch(function () { S.kq = S.kfl.concat(S.kq); S.kfl = null; toast('저장하지 못했어요 · 잠시 후 다시 시도할게요'); kT = setTimeout(kflush, 4000); });
}

}
function kfirst(x) {
  var f = x.start || TODAY;
  Object.keys(S.kc).forEach(function (d) { if (d < f && S.kc[d][x.id]) f = d; });
  return f;
}
// 기간 통계: 총 횟수, 하루 평균, 목표 달성한 날, 대상 일수, 최장 연속
function kstat(x, from, to) {
  var s0 = kfirst(x), a = s0 > from ? s0 : from, b = to < TODAY ? to : TODAY;
  var cnt = 0, ok = 0, days = 0, best = 0, run = 0;
  for (var d = from; d <= to; d = addD(d, 1)) {
    var v = kv(d, x.id); cnt += v;
    if (kok(d, x)) { run++; if (run > best) best = run; } else run = 0;
    if (d >= a && d <= b) { days++; if (kok(d, x)) ok++; }
  }
  return { cnt: cnt, ok: ok, days: days, rate: days ? ok / days : 0, avg: days ? cnt / days : 0, best: best };
}
function ktotal(from, to) {
  var ok = 0, days = 0, cnt = 0;
  S.D.counters.forEach(function (x) { var s = kstat(x, from, to); ok += s.ok; days += s.days; cnt += s.cnt; });
  return { rate: days ? ok / days : 0, cnt: cnt, ok: ok, days: days };
}
function krun(x) {
  var d = TODAY, n = 0;

  while (kok(d, x)) { n++; d = addD(d, -1); }
  return n;
}

/* 병원 기록 추가·수정 + 혈액검사 캡처 → 항목 표 */
// 검사 결과 캡처 글자 → 항목 표 (한 줄에 한 항목 / 칸마다 한 줄 / 열마다 묶인 경우 모두)
var LVAL = /^(?:[<>≤≥〈〉]?\s?-?\d[\d,]*(?:\.\d+)?(?:\s?[-~]\s?\d+(?:\.\d+)?)?\s*(?:이하|이상|미만|초과)?|\d\+|[+]{1,4}|neg(?:ative)?|pos(?:itive)?|trace|many|few|moderate|none|clear|yellow|straw|amber|음성|양성|정상)$/i;
var LREF = /^(?:[<>≤≥〈〉]\s?=?\s?\d[\d.]*|-?\d[\d.]*\s?[~～∼]\s?\d[\d.…]*|\d[\d.]*\s?[~～∼]\s?\d?[\d.]*…|\d[\d.]*\s?-\s?\d[\d.]*|negative|trace|소견란\s?참조)$/i;
var LSKIP = /^(검사명|결과|참고치|상세|검사일자|검사결과|진료카드|외래|입원|홈|건강|알림|영문|검사결과\s?이용안내|이용안내|단위|항목|판정)$/;
function labParse(txt) {
  var out = [], cur = null, date = '', names = [], vals = [], refs = [];
  var push = function (o) { o.ok = 1; o._d = date; out.push(o); return o; };
  String(txt || '').replace(/\r/g, '').replace(/[〈＜]/g, '<').replace(/[〉＞]/g, '>').split('\n').forEach(function (raw) {
    var s = raw.replace(/[ \t ]+/g, ' ').trim(), m;
    if (!s) return;
    if ((m = s.match(/(20\d{2})\s?[.\-\/년]\s?(\d{1,2})\s?[.\-\/월]\s?(\d{1,2})/))) { date = m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]); cur = null; return; }
    if (/^\d{1,2}:\d{2}/.test(s) || LSKIP.test(s.replace(/[\s(]*\(?i\)?$/, ''))) return;
    // 한 줄에 이름 · 결과 · 참고치가 다 있는 경우
    var toks = s.split(' '), k;
    for (k = 1; k < toks.length; k++) {
      var nm = toks.slice(0, k).join(' '), rest = toks.slice(k).join(' ');
      if (!/[A-Za-z가-힣γ]/.test(nm) || LVAL.test(nm) || LREF.test(nm)) continue;
      var rm = rest.match(/^(.+?)(?:\s+(\S.*))?$/), val = null, ref = '';
      for (var j = toks.length; j > k; j--) { var a = toks.slice(k, j).join(' '), b = toks.slice(j).join(' '); if (LVAL.test(a) && (!b || LREF.test(b))) { val = a; ref = b; break; } }
      if (val != null) { cur = push({ item: nm, val: val, unit: '', ref: ref }); return; }
    }
    if (LREF.test(s) && cur && cur.val != null && !cur.ref) { cur.ref = s; return; }
    if (LVAL.test(s)) { if (cur && cur.val == null) cur.val = s; else vals.push(s); return; }
    if (LREF.test(s)) { if (cur && !cur.ref) cur.ref = s; else refs.push(s); return; }
    if (/[A-Za-z가-힣γ]/.test(s) && s.length <= 40) { cur = push({ item: s, val: null, unit: '', ref: '' }); names.push(cur); }
  });
  // 열마다 묶여서 읽힌 경우: 결과 없는 이름에 남은 결과를 차례로
  var empty = out.filter(function (o) { return o.val == null; });
  if (empty.length >= 3) empty.forEach(function (o, i) { if (i < vals.length) o.val = vals[i]; });
  if (empty.length && empty.length === refs.length) empty.forEach(function (o, i) { if (!o.ref) o.ref = refs[i]; });
  // 이름 정리 (잘린 이름 → 사전의 표준 이름) · 같은 이름은 결과가 같으면 하나만
  var seen = {};
  return out.filter(function (o) { return o.val != null; }).map(function (o) {
    var x = labInfo(o.item, o.val, o.ref);
    o.item = x ? x[0] : o.item.replace(/\s*(…|\.{2,})\s*$/, '').trim();
    o.val = String(o.val).trim(); o.ref = String(o.ref || '').replace(/\s+/g, '');
    return o;
  }).filter(function (o) { var key = o._d + '|' + o.item + '|' + o.val; if (seen[key]) return false; seen[key] = 1; return true; });
}
var VB = null;
function drawKinds() {

function drawLabs() {

    return '<div class="lrow' + (l.ok ? ' ok' : '') + '" data-i="' + i + '"><input data-f="item" value="' + esc(l.item) + '" placeholder="항목"><input data-f="val" value="' + esc(l.val == null ? '' : l.val) + '" placeholder="결과"><input data-f="unit" value="' + esc(l.unit || '') + '" placeholder="단위"><input data-f="ref" value="' + esc(l.ref || '') + '" placeholder="예: 12~16"><button class="lx" aria-label="빼기">×</button></div>';
  }).join('') : '';

function openVisit(id, d) {

  VB.d0 = v ? v.d : '';
  $('#vbT').textContent = v ? '병원 기록 수정' : '병원 기록';
  $('#vbD').value = v ? v.d : (d || (S.view === 'daily' ? S.day : TODAY));
  $('#vbH').value = v ? v.hosp || '' : ''; $('#vbDp').value = v ? v.dept || '' : '';
  $('#vbN').value = v ? v.note || '' : ''; $('#vbR').value = v ? v.rx || '' : ''; $('#vbNx').value = v ? v.next || '' : '';
  var hs = {}; vList().forEach(function (x) { if (x.hosp) hs[x.hosp] = 1; });
  $('#vbHl').innerHTML = Object.keys(hs).map(function (h) { return '<option value="' + esc(h) + '">'; }).join('');
  $('#vbP').innerHTML = ''; $('#vbSt').textContent = ''; $('#vbIn').value = '';

$('#vbIn').onchange = function () {
  var files = Array.prototype.slice.call(this.files || []); if (!files.length) return;
  var my = VB, add = 0, dd = ''; VB.busy++; $('#vbS').classList.add('busy'); ocrThumbs(files, $('#vbP'));
  ocrRun(files, $('#vbSt'), function (txt) {
    labParse(txt).forEach(function (l) { if (l._d && (!dd || l._d < dd)) dd = l._d; if (VB.labs.some(function (x) { return x.item === l.item && x.val === l.val && (x._d || '') === (l._d || ''); })) return; VB.labs.push(l); add++; });
  }, function () {
    if (VB !== my) return;
    VB.busy--; if (!VB.busy) $('#vbS').classList.remove('busy');
    if (!VB.id) { var cnt = {}, best = ''; VB.labs.forEach(function (l) { if (l._d) cnt[l._d] = (cnt[l._d] || 0) + 1; }); Object.keys(cnt).forEach(function (k) { if (!best || cnt[k] > cnt[best]) best = k; }); if (best && best <= TODAY) $('#vbD').value = best; }
    if (add && VB.kind === '진료') { VB.kind = '검사'; drawKinds(); }
    drawLabs();
    var ds = {}, nd; VB.labs.forEach(function (l) { if (l._d) ds[l._d] = 1; }); nd = Object.keys(ds).length;
    $('#vbSt').textContent = add ? add + '개 항목을 읽었어요' + (nd > 1 ? ' (검사일 ' + nd + '개 — 날짜별로 따로 저장돼요)' : '') + ' · 초록 줄을 확인하고, 틀린 줄은 고치거나 × 로 빼 주세요' : '항목을 찾지 못했어요 · 아래 + 항목 추가로 직접 넣어 주세요';
  });
};
$('#vbS').onclick = function () {
  if (VB.busy) return toast('사진을 읽는 중이에요');

  var v = { id: VB.id || uid('v'), d: d, hosp: hosp, dept: $('#vbDp').value.trim(), kind: VB.kind, note: $('#vbN').value.trim(), rx: $('#vbR').value.trim(), next: $('#vbNx').value || '' };
  var mk = function (l, vis) {

  var main = ok.filter(function (l) { return !l._d || l._d === d || l._d === VB.d0; }), others = {};
  ok.forEach(function (l) { if (main.indexOf(l) < 0) (others[l._d] = others[l._d] || []).push(l); });
  var saves = [[v, main.map(function (l) { return mk(l, v); })]];

  var run = function (i) { if (i >= saves.length) return; call('appVisit', S.pin, saves[i][0], saves[i][1]).then(function () { run(i + 1); }).catch(function (e) { toast(errMsg(e)); load(); }); };

/* 검사 항목 설명 */
function openLab(id) {
  var l = (S.D.labs || []).filter(function (x) { return x.id === id; })[0]; if (!l) return;
  var x = labInfo(l.item, l.val, l.ref), f = labFlag(l), s = labSeries(l.item), u = l.unit || (x ? x[2] : '');
  var h = '<div class="lbh"><small>' + esc(l.item) + '</small><h3>' + esc(x ? x[1] : l.item) + '</h3></div>' +
    '<div class="lbv"><b class="' + (f === 'L' ? 'ml' : f ? 'mh' : '') + '">' + esc(l.val) + '</b>' + (isNaN(labNum(l.val)) ? '' : '<span>' + esc(u) + '</span>') + flagHtml(f) + '</div>' +
    '<div class="lbr">참고치 ' + esc(l.ref || '-') + ' · ' + bShort(l.d) + ' ' + esc(l.hosp || '') + '</div>';
  if (x) {
    h += '<div class="lbd"><div class="sub2">어떤 검사예요?</div><p>' + x[4] + '</p>';
    if (x[5]) h += '<div class="sub2">' + (f === 'H' || f === 'A' ? '<span class="dn">● </span>' : '') + (/^(소변|요당|아질산|유로)/.test(x[1]) || !x[6] && /양성/.test(x[5]) ? '양성·높을 때' : '높을 때') + '</div><p>' + x[5] + '</p>';
    if (x[6]) h += '<div class="sub2">' + (f === 'L' ? '<span class="up">● </span>' : '') + '낮을 때</div><p>' + x[6] + '</p>';
    h += '</div>';
  } else h += '<p class="mnote">이 항목은 아직 설명 사전에 없어요.</p>';
  if (s.length > 1) {
    var dp = s.reduce(function (a, q) { var p = String(labNum(q.val)).split('.')[1]; return Math.max(a, p ? p.length : 0); }, 0);
    h += '<div class="sub2">지난 결과</div>' + bChart(s.map(function (q) { return { v: labNum(q.val), l: bYmd(q.d) }; }), { n: l.item, u: u, dp: Math.min(dp, 3), c: '#e5484d' });
  }
  h += '<p class="mnote">일반적인 설명이에요. 결과 해석과 치료는 담당 의사와 상의해 주세요.</p>';
  $('#lbB').innerHTML = h; openBs('#lb');
}
